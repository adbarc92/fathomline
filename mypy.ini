; Strict from the first commit. Retrofitting strictness onto an eval harness is
; how a harness ends up trusting values it never checked.
[mypy]
python_version = 3.12
strict = True
warn_unreachable = True
files = src, tests

; The LeRobot adapter's third-party stack is installed only in the container
; (`--extra lerobot`, Linux), never in the lint job, so these are untyped here.
; The adapter converts every value it hands the core to a builtin type.
[mypy-lerobot.*,torch.*,huggingface_hub.*]
ignore_missing_imports = True
